services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    user: root
    ports:
      - "8000:8000"
    networks:
      - develop-network
    volumes:
      - surrealdb-data:/data
      - surrealdb-data:/logs
    entrypoint: /surreal start --user root --pass root rocksdb:/data/mydatabase.db

  surrealist:
    image: surrealdb/surrealist:latest
    ports:
      - "8080:8080"
    networks:
      - develop-network

networks:
  develop-network:
    external: true
    name: develop

volumes:
  surrealdb-data:
    name: surrealdb-data