services:
  grafana:
    image: grafana/grafana:latest
    ports:
      - '3000:3000'
    volumes:
      - grafana-data:/var/lib/grafana
#      - ./provisioning:/etc/grafana/provisioning
    networks:
      - develop-network

networks:
  develop-network:
    external: true
    name: develop

volumes:
  grafana-data:
    name: grafana-data